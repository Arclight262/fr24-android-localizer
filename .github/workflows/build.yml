name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test and build
        run: bash ./gradlew clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK packaging
        run: python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          version="$(sed -n 's/^moduleVersionName=//p' gradle.properties)"
          version_code="$(sed -n 's/^moduleVersionCode=//p' gradle.properties)"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -Fq "package: name='io.github.fr24zh.localizer' versionCode='${version_code}' versionName='${version}'" <<< "$badging"
          grep -Fq "sdkVersion:'27'" <<< "$badging"
          grep -Fq "targetSdkVersion:'35'" <<< "$badging"
          signature="$("$build_tools/apksigner" verify --verbose --print-certs "$apk")"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$signature"
          grep -Fq 'CN=Android Debug' <<< "$signature"

      - name: Package identifiable artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^moduleVersionName=//p' gradle.properties)"
          version_code="$(sed -n 's/^moduleVersionCode=//p' gradle.properties)"
          short_sha="${GITHUB_SHA::7}"
          artifact_name="fr24-localizer-${version}-${short_sha}"
          distribution_dir="app/build/distributions"
          mkdir -p "$distribution_dir"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$distribution_dir/${artifact_name}.apk"
          cd "$distribution_dir"
          sha256sum "${artifact_name}.apk" > SHA256SUMS.txt
          {
            echo "versionName=${version}"
            echo "versionCode=${version_code}"
            echo "commit=${GITHUB_SHA}"
            echo "workflowRun=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "signature=Android debug certificate; replacement install is not guaranteed"
          } > BUILD_INFO.txt
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: app/build/distributions/*
          if-no-files-found: error
